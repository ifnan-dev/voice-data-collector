# Nginx reverse proxy for the Afaan Oromo API.
# Place in /etc/nginx/sites-available/afan-api and symlink into sites-enabled.
# Replace api.yourdomain.com with your domain (or your VM public IP for HTTP-only).

server {
    listen 80;
    server_name api.yourdomain.com;

    # Match the backend's 50 MB upload limit (max_upload_size_mb).
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}